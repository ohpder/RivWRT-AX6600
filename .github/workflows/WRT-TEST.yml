#CI项目
name: WRT-TEST

#CI计划
on:
  #手动编译
  workflow_dispatch:
    inputs:
      CONFIG:
        default: 'IPQ60XX-WIFI-YES'
        required: true
        type: choice
        options:
          - IPQ60XX-WIFI-YES
      SOURCE:
        default: 'PurpleRed-River/immortalwrt'
        required: true
        type: choice
        options:
          - PurpleRed-River/immortalwrt
          - immortalwrt/immortalwrt
          - LiBwrt/openwrt-6.x
          - qosmio/openwrt-ipq
      BRANCH:
        default: 'main'
        required: true
        type: string
      PACKAGE:
        required: false
        type: string
      PROFILE:
        description: '固件版本：ImmortalWRT 定制版。'
        default: 'ImmortalWRT'
        required: true
        type: choice
        options:
          - ImmortalWRT
      TEST:
        description: '仅输出配置文件，不编译固件。'
        default: 'true'
        required: true
        type: boolean

#CI权限（最小化：TEST=true 时只读；保留写权限以支持 TEST=false 完整编译）
permissions:
  contents: write   # TEST=false 时创建 Release
  actions: write    # 缓存读写、Artifact 上传

#CI任务
jobs:
  config:
    name: ${{inputs.CONFIG}}
    #调用公用编译核心WRT-CORE.yml
    uses: ./.github/workflows/WRT-CORE.yml
    with:
      #编译配置
      WRT_CONFIG: ${{inputs.CONFIG}}
      #默认主题
      WRT_THEME: aurora
      #默认主机名
      WRT_NAME: ImmortalWRT
      #默认WIFI名称
      WRT_SSID: ImmortalWRT
      #默认WIFI密码
      WRT_WORD: ''  # WiFi 默认开放无密码
      #默认地址
      WRT_IP: 192.168.100.1
      #默认密码，仅作提示，修改无用
      WRT_PW: 无
      #源码链接
      WRT_REPO: https://github.com/${{inputs.SOURCE}}.git
      #源码分支
      WRT_BRANCH: ${{inputs.BRANCH}}
      #源码名称
      WRT_SOURCE: ${{inputs.SOURCE}}
      #插件调整
      WRT_PACKAGE: ${{inputs.PACKAGE}}
      #固件版本
      WRT_PROFILE: ${{inputs.PROFILE}}
      #仅输出配置文件
      WRT_TEST: ${{inputs.TEST}}
