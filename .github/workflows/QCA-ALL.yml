#CI项目
name: QCA-ALL

#CI计划
on:
  #手动编译
  workflow_dispatch:
    inputs:
      PACKAGE:
        description: '手动调整插件包，多个请用\n符号隔开。'
        required: false
        type: string
      TEST:
        description: '仅输出配置文件，不编译固件。'
        default: false
        required: false
        type: boolean

#CI权限（最小化：仅发布 Release 与缓存/产物所需的写权限）
permissions:
  contents: write   # 创建 Release、上传固件
  actions: write    # 缓存读写、Artifact 上传

#CI任务
jobs:
  config:
    name: ${{matrix.CONFIG}}-${{matrix.PROFILE}}
    strategy:
      fail-fast: false
      matrix:
        CONFIG: [IPQ60XX-WIFI-YES]
        PROFILE: [ImmortalWRT]
        SOURCE: [VIKINGYFY/immortalwrt]
        BRANCH: [main]

    #调用公用编译核心WRT-CORE.yml
    uses: ./.github/workflows/WRT-CORE.yml
    with:
      #编译配置
      WRT_CONFIG: ${{matrix.CONFIG}}
      #默认主题：aurora（eamonxg 版，自带自动激活脚本）
      WRT_THEME: aurora
      #默认主机名
      WRT_NAME: ydn
      #默认WIFI名称
      WRT_SSID: WIFI
      #默认WIFI密码
      WRT_WORD: '88886666'  # WiFi 默认开放无密码
      #默认地址
      WRT_IP: 192.168.0.1
      #默认密码，仅作提示，修改无用
      WRT_PW: ""
      #源码链接
      WRT_REPO: https://github.com/${{matrix.SOURCE}}.git
      #源码分支
      WRT_BRANCH: ${{matrix.BRANCH}}
      #源码名称
      WRT_SOURCE: ${{matrix.SOURCE}}
      #插件调整
      WRT_PACKAGE: ${{inputs.PACKAGE}}
      #固件版本：ImmortalWRT 定制版
      WRT_PROFILE: ${{matrix.PROFILE}}
      #仅输出配置文件
      WRT_TEST: ${{inputs.TEST}}
